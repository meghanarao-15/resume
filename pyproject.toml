[project]
name = "job-apply"
version = "0.1.0"
description = "Human-approved job matching and apply-packet drafting"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-apply = "job_apply.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
