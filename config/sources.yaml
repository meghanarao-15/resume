# Public / documented job sources. No LinkedIn scraping.
# Optional API keys are read from the environment; search still works without them.

user_agent: meghana-job-apply/0.1 (personal job search; respectful public API client)

greenhouse_boards:
  - cloudflare
  - gitlab
  - datadog
  - elastic
  - okta
  - mongodb
  - stripe
  - twilio
  - figma
  - anthropic

lever_companies:
  - palantir

ashby_boards:
  - openai
  - linear
  - notion
  - vercel

remotive:
  enabled: true
  search: security

arbeitnow:
  enabled: true

# Optional paid/keyed APIs — skipped unless env vars are set.
adzuna:
  enabled_if_env: [ADZUNA_APP_ID, ADZUNA_APP_KEY]
  country: in
  what: security analyst OR penetration tester OR application security
  where: Bangalore

reed:
  enabled_if_env: [REED_API_KEY]
  keywords: security analyst penetration tester application security
